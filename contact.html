
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Thanawat</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .contact-container {
            max-width: 850px;
            margin: 50px auto;
            padding: 45px;
            background: #fffaf0;
            border: 1px solid #d8c49a;
            border-radius: 15px;
            color: #183c2b;
        }

        .contact-subtitle {
            color: #a52e32;
            letter-spacing: 3px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .contact-container h1 {
            color: #17452f;
            font-size: 32px;
            margin-bottom: 15px;
        }

        .contact-name {
            margin-bottom: 30px;
            color: #65553c;
        }

        .contact-container hr {
            border: 0;
            border-top: 1px solid #d8c49a;
            margin-bottom: 30px;
        }

        .contact-list {
            padding-left: 25px;
        }

        .contact-list li {
            margin-bottom: 18px;
            padding-left: 5px;
        }

        .contact-box {
            border: 1px solid #b99b5b;
            border-left: 5px solid #17452f;
            background: #fffdf7;
            padding: 18px;
            border-radius: 9px;
            transition: 0.3s;
        }

        .contact-box:hover {
            border-left-color: #a52e32;
            transform: translateY(-3px);
        }

        .contact-box h3 {
            color: #17452f;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .contact-box a {
            color: #a52e32;
            text-decoration: none;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .contact-box a:hover {
            text-decoration: underline;
        }

        .contact-back {
            display: inline-block;
            margin-top: 18px;
            padding: 13px 23px;
            background: #17452f;
            color: #fffaf0;
            text-decoration: none;
            border-radius: 7px;
            transition: 0.3s;
        }

        .contact-back:hover {
            background: #a52e32;
        }

        @media (max-width: 600px) {
            .contact-container {
                margin: 20px auto;
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

    <div class="contact-container">

        <p class="contact-subtitle">CONTACT INFORMATION</p>

        <h1>Contact Me</h1>

        <p class="contact-name">
            ธนวัฒน์ จงสูงเนิน
        </p>

        <hr>

        <ol class="contact-list">

            <li>
                <div class="contact-box">
                    <h3>Email</h3>
                    <a href="mailto:thanawatjongsungnern@gmail.com">
                        thanawatjongsungnern@gmail.com
                    </a>
                </div>
            </li>

            <li>
                <div class="contact-box">
                    <h3>Phone Number</h3>
                    <a href="tel:0917188068">
                        091-718-8068
                    </a>
                </div>
            </li>

            <li>
                <div class="contact-box">
                    <h3>Instagram</h3>
                    <a href="https://www.instagram.com/_peach.tnw?psln=dWpwbXdqcGVpbDMx&utm_source=qr"
                       target="_blank">
                        instagram.com/_peach.tnw
                    </a>
                </div>
            </li>

        </ol>

        <a href="index.html" class="contact-back">
            ← Back to Home
        </a>

    </div>

</body>
</html>
