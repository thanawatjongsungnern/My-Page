<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f5ff;
            background-image: radial-gradient(#b5ccf5 1px, transparent 1px);
            background-size: 24px 24px;
            color: #183153;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            background-color: white;
            padding: 50px 40px 40px;
            border: 1px solid #d5e0f0;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .subtitle {
            font-size: 12px;
            letter-spacing: 2px;
            color: #4269a5;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 22px;
            color: #183153;
        }

        .name {
            font-size: 16px;
            margin-bottom: 34px;
        }

        hr {
            border: none;
            border-top: 1px solid #d5e0f0;
            margin-bottom: 30px;
        }

        ol {
            padding-left: 26px;
        }

        li {
            padding-left: 5px;
            margin-bottom: 18px;
        }

        .contact-box {
            border: 1px solid #3865bd;
            border-radius: 9px;
            padding: 14px 12px;
            min-height: 85px;
            transition: 0.3s;
        }

        .contact-box:hover {
            background-color: #f5f8ff;
            transform: translateY(-2px);
        }

        .contact-box h3 {
            font-size: 15px;
            margin-bottom: 16px;
        }

        .contact-box p,
        .contact-box a {
            font-size: 14px;
            color: #183153;
        }

        .contact-box a:hover {
            color: #3865bd;
        }

        .back-button {
            display: inline-block;
            background-color: #3865a8;
            color: white;
            text-decoration: none;
            padding: 14px 22px;
            border-radius: 6px;
            margin-top: 16px;
            transition: 0.3s;
        }

        .back-button:hover {
            background-color: #244779;
        }

        footer {
            text-align: center;
            margin-top: 28px;
            font-size: 13px;
        }

        footer a {
            color: #315c9c;
            margin: 0 5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 22px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <p class="subtitle">CONTACT INFORMATION</p>

        <h1>Contact Me</h1>

        <p class="name">ธนวัฒน์ จงสูงเนิน</p>

        <hr>

        <ol>
            <!-- Email -->
            <li>
                <div class="contact-box">
                    <h3>Email</h3>
                    <p>
                        <a href="mailto:thanawatjongsungnern@gmail.com">
                            thanawatjongsungnern@gmail.com
                        </a>
                    </p>
                </div>
            </li>

            <!-- Phone Number -->
            <li>
                <div class="contact-box">
                    <h3>Phone Number</h3>
                    <p>
                        <a href="tel:0917188068">
                            091-718-8068
                        </a>
                    </p>
                </div>
            </li>

            <!-- Instagram -->
            <li>
                <div class="contact-box">
                    <h3>Instagram</h3>
                    <p>
                        <a href="https://www.instagram.com/_peach.tnw?psln=dWpwbXdqcGVpbDMx&utm_source=qr"
                           target="_blank">
                            instagram.com/_peach.tnw
                        </a>
                    </p>
                </div>
            </li>
        </ol>

        <a href="index.html" class="back-button">
            Back to Home
        </a>

    </div>

    <footer>
        <a href="index.html">Home</a>
    </footer>

</body>
</html>
